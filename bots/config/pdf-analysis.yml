# PDF Analysis Bot Configuration

thresholds:
  accept: 70      # Auto-index if score >= 70
  review: 40      # Manual review if 40 <= score < 70
  reject: 40      # Auto-trash if score < 40

processing:
  ocr_enabled: true
  max_file_size_mb: 100
  timeout_seconds: 300
  parallel_processing: true
  max_workers: 4

scoring:
  weights:
    keyword_match: 0.30
    entity_match: 0.30
    context_analysis: 0.40
  
  keyword_points:
    high_priority: 10
    medium_priority: 5
    low_priority: 2
  
  entity_points:
    person: 8
    location: 6
    organization: 6
    date: 4

ai_services:
  use_azure_openai: true
  use_document_intelligence: true
  model: "gpt-4"
  temperature: 0.1
  max_tokens: 1000

output:
  save_reports: true
  report_format: "json"
  include_full_text: false
  include_metadata: true
  log_level: "INFO"

routing:
  accepted_dir: "data/indexed"
  review_dir: "data/review"
  trash_dir: "data/trash"
  preserve_original: true
  create_backup: true

privacy:
  redact_sensitive_info: true
  protect_victim_identities: true
  comply_with_sealing: true
  pii_detection: true

notifications:
  enabled: true
  notify_on_high_relevance: true
  notify_on_errors: true
  notify_on_review_needed: true
