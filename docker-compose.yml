version: '3.8'

services:
  # Main application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: epstein-files-hub
    volumes:
      # Mount source code for development
      - .:/app
      # Persistent data volumes
      - data-files:/app/data
      - logs:/app/logs
      - cache:/app/cache
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    working_dir: /app
    stdin_open: true
    tty: true
    command: /bin/bash
    networks:
      - epstein-hub-network

  # Service to fetch public files
  fetch-public-files:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: fetch-public-files
    volumes:
      - data-files:/app/data
      - logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: python scripts/fetch-public-files.py
    networks:
      - epstein-hub-network
    profiles:
      - maintenance

  # Service to process PDFs
  process-pdfs:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: process-pdfs
    volumes:
      - data-files:/app/data
      - logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: python scripts/process-pdfs.py
    networks:
      - epstein-hub-network
    profiles:
      - maintenance

  # Service to generate search index
  generate-search-index:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: generate-search-index
    volumes:
      - data-files:/app/data
      - ./web:/app/web
      - logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: python scripts/generate-search-index.py
    networks:
      - epstein-hub-network
    profiles:
      - maintenance

  # Service to fetch Wikipedia data
  fetch-wikipedia:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: fetch-wikipedia
    volumes:
      - data-files:/app/data
      - logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: python scripts/fetch-wikipedia-data.py
    networks:
      - epstein-hub-network
    profiles:
      - maintenance

  # Web server for local development (optional)
  web:
    image: nginx:alpine
    container_name: epstein-files-web
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    networks:
      - epstein-hub-network
    profiles:
      - web

networks:
  epstein-hub-network:
    driver: bridge

volumes:
  data-files:
    driver: local
  logs:
    driver: local
  cache:
    driver: local
