# ============================================================================
# EPSTEIN FILES HUB - ALGOLIA INTEGRATION & ANALYTICS
# Docker Compose Configuration
# ============================================================================
#
# This Docker Compose file provides a complete local development and testing
# environment with all required services and dependencies.
#
# SERVICES:
# - api: FastAPI backend application
# - postgres: PostgreSQL database for analytics
# - redis: Redis cache and rate limiting
# - prometheus: Metrics collection
# - grafana: Metrics visualization
# - jaeger: Distributed tracing
# - nginx: Reverse proxy and static file serving
#
# USAGE:
#   Development: docker-compose up
#   Production: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Scaling: docker-compose up --scale api=3
#   Logs: docker-compose logs -f api
#   Stop: docker-compose down
#   Clean: docker-compose down -v (removes volumes)
#
# REQUIREMENTS:
# - Docker 24.0+
# - Docker Compose 2.20+
# - 4GB RAM minimum, 8GB recommended
# - 20GB disk space
#
# ============================================================================

version: '3.9'

# ============================================================================
# SERVICES
# ============================================================================

services:

  # ==========================================================================
  # API SERVICE (FastAPI Backend)
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=3.11
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - VCS_REF=${VCS_REF:-unknown}
    image: epstein-files-api:latest
    container_name: epstein-api
    restart: unless-stopped

    # Port mapping
    ports:
      - "8000:8000"    # API
      - "9090:9090"    # Prometheus metrics

    # Environment variables (load from .env file)
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/epstein_analytics
      - REDIS_URL=redis://redis:6379/0
      - JAEGER_AGENT_HOST=jaeger
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus

    # Volume mounts
    volumes:
      - ./api:/app/api:ro                    # API code (read-only)
      - ./epstein_files:/app/epstein_files:ro  # Core library (read-only)
      - ./logs:/app/logs                      # Application logs
      - api-cache:/app/cache                  # Cache directory
      - api-checkpoints:/app/checkpoints      # Indexing checkpoints

    # Dependencies
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=api"

    # Networks
    networks:
      - backend
      - frontend

  # ==========================================================================
  # POSTGRESQL DATABASE (Analytics Storage)
  # ==========================================================================
  postgres:
    image: postgres:16.2-alpine
    container_name: epstein-postgres
    restart: unless-stopped

    # Port mapping (expose only in development)
    ports:
      - "5432:5432"

    # Environment variables
    environment:
      - POSTGRES_DB=epstein_analytics
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
      - PGDATA=/var/lib/postgresql/data/pgdata

    # Volume for data persistence
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Networks
    networks:
      - backend

  # ==========================================================================
  # REDIS (Cache and Rate Limiting)
  # ==========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: epstein-redis
    restart: unless-stopped

    # Port mapping
    ports:
      - "6379:6379"

    # Command with persistence and memory limits
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --save 300 100
      --save 600 1

    # Volume for data persistence
    volumes:
      - redis-data:/data

    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

    # Networks
    networks:
      - backend

  # ==========================================================================
  # PROMETHEUS (Metrics Collection)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: epstein-prometheus
    restart: unless-stopped

    # Port mapping
    ports:
      - "9091:9090"

    # Command with config
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

    # Volumes
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

    # Dependencies
    depends_on:
      - api

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    # Networks
    networks:
      - backend
      - monitoring

  # ==========================================================================
  # GRAFANA (Metrics Visualization)
  # ==========================================================================
  grafana:
    image: grafana/grafana:10.3.3
    container_name: epstein-grafana
    restart: unless-stopped

    # Port mapping
    ports:
      - "3000:3000"

    # Environment variables
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_ANALYTICS_REPORTING_ENABLED=false

    # Volumes
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

    # Dependencies
    depends_on:
      - prometheus

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

    # Networks
    networks:
      - monitoring
      - frontend

  # ==========================================================================
  # JAEGER (Distributed Tracing)
  # ==========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: epstein-jaeger
    restart: unless-stopped

    # Port mapping
    ports:
      - "5775:5775/udp"   # Zipkin compact thrift
      - "6831:6831/udp"   # Jaeger compact thrift
      - "6832:6832/udp"   # Jaeger binary thrift
      - "5778:5778"       # Serve configs
      - "16686:16686"     # Jaeger UI
      - "14268:14268"     # Jaeger collector HTTP
      - "14250:14250"     # Jaeger gRPC
      - "9411:9411"       # Zipkin compatible endpoint

    # Environment variables
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

    # Networks
    networks:
      - backend
      - monitoring

  # ==========================================================================
  # NGINX (Reverse Proxy and Static Files)
  # ==========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: epstein-nginx
    restart: unless-stopped

    # Port mapping
    ports:
      - "80:80"
      - "443:443"

    # Volumes
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx

    # Dependencies
    depends_on:
      - api

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    # Networks
    networks:
      - frontend
      - backend

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

  backend:
    driver: bridge
    internal: true  # Not accessible from outside
    ipam:
      config:
        - subnet: 172.21.0.0/24

  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  # Database
  postgres-data:
    driver: local

  # Cache
  redis-data:
    driver: local

  # API
  api-cache:
    driver: local
  api-checkpoints:
    driver: local

  # Monitoring
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

  # Nginx
  nginx-cache:
    driver: local
  nginx-logs:
    driver: local

# ============================================================================
# CONFIGURATION NOTES
# ============================================================================
#
# Security Considerations:
# - Change default passwords in production
# - Use secrets management for sensitive data
# - Enable HTTPS with valid SSL certificates
# - Implement network segmentation
# - Regular security updates
#
# Performance Tuning:
# - Adjust resource limits based on workload
# - Scale API service horizontally: docker-compose up --scale api=3
# - Use connection pooling
# - Enable caching aggressively
#
# High Availability:
# - Use Docker Swarm or Kubernetes for orchestration
# - Implement health checks and auto-restart
# - Set up database replication
# - Use load balancer (Nginx, HAProxy, or cloud LB)
#
# Monitoring:
# - Prometheus: http://localhost:9091
# - Grafana: http://localhost:3000 (admin/admin)
# - Jaeger: http://localhost:16686
# - API Docs: http://localhost:8000/api/docs
#
# Backup and Recovery:
# - Postgres: pg_dump via cron or backup service
# - Redis: RDB/AOF files in redis-data volume
# - Volumes: Regular backups to S3/Azure Blob
#
# ============================================================================
