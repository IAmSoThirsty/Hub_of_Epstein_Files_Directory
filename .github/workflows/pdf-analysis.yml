name: PDF Analysis and Routing

on:
  push:
    paths:
      - 'data/uploads/**.pdf'
  pull_request:
    paths:
      - 'data/uploads/**.pdf'
  workflow_dispatch:
    inputs:
      file_path:
        description: 'Specific PDF file to analyze'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  analyze-pdfs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils libmagic1
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install PyPDF2 pdf2image pytesseract pillow pyyaml python-magic requests
      
      - name: Create necessary directories
        run: |
          mkdir -p data/uploads data/trash data/review logs/pdf-analysis
      
      - name: Analyze uploaded PDFs
        id: analysis
        env:
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_DOC_INTEL_KEY: ${{ secrets.AZURE_DOC_INTEL_KEY }}
          AZURE_DOC_INTEL_ENDPOINT: ${{ secrets.AZURE_DOC_INTEL_ENDPOINT }}
        run: |
          python bots/pdf-analysis-bot/analyze.py \
            --dir data/uploads/ \
            --output logs/pdf-analysis/results.json
        continue-on-error: true
      
      - name: Route documents
        run: |
          python bots/pdf-analysis-bot/route.py \
            --input logs/pdf-analysis/results.json
        continue-on-error: true
      
      - name: Generate report
        run: |
          python bots/pdf-analysis-bot/report.py \
            --input logs/pdf-analysis/results.json \
            --output logs/pdf-analysis/report.md
        continue-on-error: true
      
      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'logs/pdf-analysis/report.md';
            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## PDF Analysis Results\n\n' + report
              });
            }
      
      - name: Commit routed files
        run: |
          git config user.name "PDF Analysis Bot"
          git config user.email "bot@github.com"
          git add data/ docs/ logs/
          git diff --staged --quiet || git commit -m "🤖 Process PDF uploads: route and index documents"
        continue-on-error: true
      
      - name: Push changes
        if: github.event_name != 'pull_request'
        run: git push
        continue-on-error: true
      
      - name: Upload analysis logs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: pdf-analysis-logs
          path: logs/pdf-analysis/
          retention-days: 30

  notify-results:
    runs-on: ubuntu-latest
    needs: analyze-pdfs
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Create summary
        run: |
          echo "## PDF Analysis Workflow Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Analysis has been completed. Check the logs for details." >> $GITHUB_STEP_SUMMARY
