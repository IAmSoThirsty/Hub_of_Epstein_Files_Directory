name: Agent Monitoring & Health Checks

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  system-health:
    runs-on: ubuntu-latest
    name: System Health Monitoring
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      
      - name: Check Agent Status
        run: |
          python bots/monitoring-agents/system_monitor.py \
            --check-all \
            --output logs/system-health.json
      
      - name: Generate Health Report
        run: |
          python bots/monitoring-agents/health_report.py \
            --input logs/system-health.json \
            --output logs/health-report.md
      
      - name: Check Processing Queues
        run: |
          python bots/monitoring-agents/queue_monitor.py \
            --check-all-queues \
            --alert-threshold 1000
      
      - name: Resource Utilization Check
        run: |
          python bots/monitoring-agents/resource_monitor.py \
            --check-storage \
            --check-api-limits \
            --check-bandwidth
      
      - name: Commit monitoring data
        run: |
          git config user.name "System Monitoring Agent"
          git config user.email "bot@github.com"
          git add logs/
          git diff --staged --quiet || git commit -m "📊 System health check"
          git push

  agent-performance:
    runs-on: ubuntu-latest
    name: Agent Performance Metrics
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      
      - name: Collect Performance Metrics
        run: |
          python bots/monitoring-agents/performance_monitor.py \
            --collect-metrics \
            --output logs/performance-metrics.json
      
      - name: Analyze Processing Speed
        run: |
          python bots/monitoring-agents/performance_analyzer.py \
            --input logs/performance-metrics.json \
            --benchmark
      
      - name: Generate Performance Report
        run: |
          echo "## Agent Performance Report" > logs/performance-report.md
          echo "" >> logs/performance-report.md
          echo "### Image Agents" >> logs/performance-report.md
          echo "- Indexing: $(jq -r '.image_agents.indexing.rate' logs/performance-metrics.json) images/day" >> logs/performance-report.md
          echo "- Analysis: $(jq -r '.image_agents.analysis.rate' logs/performance-metrics.json) images/day" >> logs/performance-report.md
          echo "" >> logs/performance-report.md
          echo "### Document Agents" >> logs/performance-report.md
          echo "- Indexing: $(jq -r '.document_agents.indexing.rate' logs/performance-metrics.json) documents/day" >> logs/performance-report.md
          echo "- Analysis: $(jq -r '.document_agents.analysis.rate' logs/performance-metrics.json) documents/day" >> logs/performance-report.md
      
      - name: Commit performance data
        run: |
          git config user.name "Performance Monitoring Agent"
          git config user.email "bot@github.com"
          git add logs/
          git diff --staged --quiet || git commit -m "📈 Performance metrics updated"
          git push

  data-integrity:
    runs-on: ubuntu-latest
    name: Data Integrity Checks
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      
      - name: Verify Data Integrity
        run: |
          python bots/quality-agents/data_integrity_checker.py \
            --check-indexes \
            --check-links \
            --check-duplicates
      
      - name: Validate Metadata
        run: |
          python bots/quality-agents/metadata_validator.py \
            --validate-all \
            --fix-errors
      
      - name: Check Database Consistency
        run: |
          python bots/quality-agents/consistency_checker.py \
            --cross-validate
      
      - name: Generate Integrity Report
        run: |
          python bots/quality-agents/integrity_report.py \
            --output logs/integrity-report.md
      
      - name: Commit integrity data
        run: |
          git config user.name "Data Integrity Agent"
          git config user.email "bot@github.com"
          git add logs/
          git diff --staged --quiet || git commit -m "✅ Data integrity verified"
          git push

  capacity-planning:
    runs-on: ubuntu-latest
    name: Capacity Planning & Forecasting
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      
      - name: Analyze Current Capacity
        run: |
          python bots/monitoring-agents/capacity_analyzer.py \
            --current-stats \
            --forecast-30days
      
      - name: Check Growth Trends
        run: |
          python bots/monitoring-agents/trend_analyzer.py \
            --analyze-growth \
            --predict-needs
      
      - name: Generate Capacity Report
        run: |
          python bots/monitoring-agents/capacity_report.py \
            --output logs/capacity-report.md
      
      - name: Commit capacity data
        run: |
          git config user.name "Capacity Planning Agent"
          git config user.email "bot@github.com"
          git add logs/
          git diff --staged --quiet || git commit -m "📊 Capacity planning update"
          git push

  alert-check:
    runs-on: ubuntu-latest
    name: Check for Critical Alerts
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      
      - name: Check for Alerts
        id: alerts
        run: |
          python bots/monitoring-agents/alert_checker.py \
            --check-all \
            --severity critical
      
      - name: Create Issue for Critical Alerts
        if: steps.alerts.outputs.has_critical == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const alerts = JSON.parse(fs.readFileSync('logs/critical-alerts.json', 'utf8'));
            
            if (alerts.length > 0) {
              const body = '## ⚠️ Critical System Alerts\n\n' +
                alerts.map(a => `- **${a.type}**: ${a.message}`).join('\n');
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Critical Alert: System Attention Required',
                body: body,
                labels: ['critical', 'automated-alert']
              });
            }

  daily-summary:
    runs-on: ubuntu-latest
    needs: [system-health, agent-performance, data-integrity, capacity-planning]
    if: github.event.schedule == '0 0 * * *'  # Run once daily at midnight
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Generate Daily Summary
        run: |
          python bots/monitoring-agents/daily_summary.py \
            --generate-report \
            --output logs/daily-summary.md
      
      - name: Create Summary Issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('logs/daily-summary.md', 'utf8');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Daily System Summary - ${new Date().toISOString().split('T')[0]}`,
              body: summary,
              labels: ['daily-summary', 'automated-report']
            });
      
      - name: Update Dashboard
        run: |
          python bots/monitoring-agents/dashboard_updater.py \
            --update-web-dashboard \
            --output web/dashboard.html
      
      - name: Commit summary
        run: |
          git config user.name "Daily Summary Agent"
          git config user.email "bot@github.com"
          git add logs/ web/dashboard.html
          git diff --staged --quiet || git commit -m "📊 Daily summary generated"
          git push
