name: Uncensored.ai Integration

on:
  schedule:
    # Run daily at 2 AM UTC for continuous data extraction
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      categories:
        description: 'Categories to fetch (comma-separated: documents,images,flight_logs,financial or "all")'
        required: false
        type: string
        default: 'all'
      force_refresh:
        description: 'Force refresh (ignore cache)'
        required: false
        type: boolean
        default: false

jobs:
  fetch-uncensored-files:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to commit and push changes
      actions: read    # Required to read workflow files
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests
      
      - name: Create data directories
        run: |
          mkdir -p data/uncensored_files/{documents,images,videos,flight_logs,financial,metadata}
          mkdir -p logs
      
      - name: Configure environment
        run: |
          # Create .env from secrets and inputs
          cat > .env << EOF
          # Uncensored.ai Configuration
          UNCENSORED_AI_ENABLED=true
          UNCENSORED_AI_BASE_URL=${{ secrets.UNCENSORED_AI_BASE_URL || 'https://api.uncensored.ai/v1' }}
          UNCENSORED_AI_API_KEY=${{ secrets.UNCENSORED_AI_API_KEY }}
          UNCENSORED_AI_RATE_LIMIT=2
          UNCENSORED_FILES_DIR=./data/uncensored_files
          
          # General settings
          LOG_LEVEL=INFO
          CACHE_ENABLED=true
          CACHE_TTL=3600
          EOF
      
      - name: Fetch Uncensored.ai files
        id: fetch
        run: |
          echo "Starting Uncensored.ai data extraction..."
          
          # Determine categories to fetch
          CATEGORIES="${{ github.event.inputs.categories || 'all' }}"
          FORCE_FLAG=""
          
          if [[ "${{ github.event.inputs.force_refresh }}" == "true" ]]; then
            FORCE_FLAG="--force"
          fi
          
          # Run fetch script
          if [[ "$CATEGORIES" == "all" ]]; then
            python scripts/fetch-uncensored-files.py --all --non-interactive $FORCE_FLAG
          else
            # Fetch each category separately
            IFS=',' read -ra CATS <<< "$CATEGORIES"
            for cat in "${CATS[@]}"; do
              python scripts/fetch-uncensored-files.py --category "$cat" --non-interactive $FORCE_FLAG
            done
          fi
          
          # Get statistics
          python scripts/fetch-uncensored-files.py --stats
        continue-on-error: false
      
      - name: Process downloaded files
        run: |
          echo "Processing downloaded documents..."
          
          # Process PDFs if any documents were downloaded
          if [ -d "data/uncensored_files/documents" ] && [ "$(ls -A data/uncensored_files/documents)" ]; then
            python scripts/process-pdfs.py || echo "PDF processing completed with warnings"
          fi
        continue-on-error: true
      
      - name: Update search index
        run: |
          echo "Updating search index..."
          python scripts/generate-search-index.py || echo "Search index update completed"
        continue-on-error: true
      
      - name: Generate report
        id: report
        run: |
          echo "Generating integration report..."
          
          # Get current date
          REPORT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          # Create report header
          cat > data/uncensored_files/integration_report.md << EOF
          # Uncensored.ai Integration Report
          
          **Date:** $REPORT_DATE
          **Workflow:** ${{ github.workflow }}
          **Run:** ${{ github.run_number }}
          
          ## Summary
          
          EOF
          
      - name: Generate report statistics
        if: always()
        run: |
          # Add statistics if available
          if [ -f "data/uncensored_files/fetch_results.json" ]; then
            python3 scripts/generate-uncensored-report.py
            
            # Add to job summary
            cat data/uncensored_files/integration_report.md >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Check for changes
        id: check_changes
        run: |
          # Create timestamp file at start if it doesn't exist
          TIMESTAMP_FILE=".workflow_start_time"
          if [ ! -f "$TIMESTAMP_FILE" ]; then
            touch "$TIMESTAMP_FILE"
          fi
          
          git add -N data/uncensored_files/
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new files downloaded"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            
            # Count new files by comparing modification times
            NEW_FILES=$(find data/uncensored_files -type f -newer "$TIMESTAMP_FILE" 2>/dev/null | wc -l || echo "0")
            echo "new_files=$NEW_FILES" >> $GITHUB_OUTPUT
            echo "Found $NEW_FILES new files"
          fi
      
      - name: Check repository size
        if: steps.check_changes.outputs.changed == 'true'
        id: check_size
        run: |
          # Calculate size of uncensored_files directory
          SIZE_BYTES=$(du -sb data/uncensored_files | cut -f1)
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "Repository size: ${SIZE_MB}MB"
          
          # GitHub has a 1GB repository limit (soft) and 100MB file limit (hard)
          # We'll be conservative and warn at 500MB
          if [ $SIZE_MB -gt 500 ]; then
            echo "⚠️ Warning: Repository size exceeds 500MB" >> $GITHUB_STEP_SUMMARY
            echo "Consider using Git LFS for large files" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add files selectively
          git add data/uncensored_files/metadata/*.json
          git add data/uncensored_files/*.json
          git add data/uncensored_files/*.md
          
          # Commit with detailed message
          COMMIT_MSG="🔄 Uncensored.ai: Update Epstein files [automated]

          - New files: ${{ steps.check_changes.outputs.new_files || 0 }}
          - Size: ${{ steps.check_size.outputs.size_mb || 0 }}MB
          - Workflow: ${{ github.workflow }}
          - Run: ${{ github.run_number }}"
          
          git commit -m "$COMMIT_MSG" || echo "No changes to commit"
          git push || echo "Push failed, may need to pull first"
        continue-on-error: true
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: uncensored-integration-logs
          path: |
            logs/
            data/uncensored_files/*.json
            data/uncensored_files/*.md
          retention-days: 30
      
      - name: Final summary
        if: always()
        run: |
          echo "### Uncensored.ai Integration Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Cost:** \$0 (Free tier)" >> $GITHUB_STEP_SUMMARY
          echo "**Runtime:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ steps.check_changes.outputs.changed }}" == "true" ]]; then
            echo "✅ New files integrated" >> $GITHUB_STEP_SUMMARY
            echo "- Files: ${{ steps.check_changes.outputs.new_files || 0 }}" >> $GITHUB_STEP_SUMMARY
            echo "- Size: ${{ steps.check_size.outputs.size_mb || 0 }}MB" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No new files (all up to date)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next scheduled run:** Daily at 2:00 AM UTC" >> $GITHUB_STEP_SUMMARY
