name: Image Management - Automated Processing

on:
  push:
    paths:
      - 'data/images/**'
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  image-indexing:
    runs-on: ubuntu-latest
    name: Index and Catalog Images
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pillow opencv-python-headless azure-cognitiveservices-vision-computervision
          pip install exifread imagehash requests pyyaml
      
      - name: Run Image Indexing Agent
        env:
          AZURE_CV_KEY: ${{ secrets.AZURE_COMPUTER_VISION_KEY }}
          AZURE_CV_ENDPOINT: ${{ secrets.AZURE_COMPUTER_VISION_ENDPOINT }}
        run: |
          python bots/image-agents/indexing_agent.py \
            --dir data/images/ \
            --output data/indexes/image_index.json
      
      - name: Commit index updates
        run: |
          git config user.name "Image Indexing Agent"
          git config user.email "bot@github.com"
          git add data/indexes/
          git diff --staged --quiet || git commit -m "🖼️ Update image index"
          git push

  image-analysis:
    runs-on: ubuntu-latest
    needs: image-indexing
    name: Analyze Image Content
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install azure-cognitiveservices-vision-computervision
          pip install azure-ai-textanalytics pillow
      
      - name: Run Image Analysis Agent
        env:
          AZURE_CV_KEY: ${{ secrets.AZURE_COMPUTER_VISION_KEY }}
          AZURE_CV_ENDPOINT: ${{ secrets.AZURE_COMPUTER_VISION_ENDPOINT }}
        run: |
          python bots/image-agents/analysis_agent.py \
            --input data/indexes/image_index.json \
            --output data/analysis/image_analysis.json
      
      - name: Commit analysis results
        run: |
          git config user.name "Image Analysis Agent"
          git config user.email "bot@github.com"
          git add data/analysis/
          git diff --staged --quiet || git commit -m "🔍 Update image analysis"
          git push

  image-verification:
    runs-on: ubuntu-latest
    needs: image-analysis
    name: Verify Image Authenticity
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run Image Verification Agent
        run: |
          python bots/image-agents/verification_agent.py \
            --input data/analysis/image_analysis.json \
            --output data/verification/image_verification.json
      
      - name: Commit verification results
        run: |
          git config user.name "Image Verification Agent"
          git config user.email "bot@github.com"
          git add data/verification/
          git diff --staged --quiet || git commit -m "✅ Update image verification"
          git push

  image-organization:
    runs-on: ubuntu-latest
    needs: image-verification
    name: Organize and Categorize Images
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run Image Organization Agent
        run: |
          python bots/image-agents/organization_agent.py \
            --input data/verification/image_verification.json \
            --categories docs/categories.yml
      
      - name: Commit organization changes
        run: |
          git config user.name "Image Organization Agent"
          git config user.email "bot@github.com"
          git add data/images/
          git diff --staged --quiet || git commit -m "📁 Organize images by category"
          git push

  image-maintenance:
    runs-on: ubuntu-latest
    name: Image Maintenance and Quality Checks
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run Image Maintenance Agent
        run: |
          python bots/image-agents/maintenance_agent.py \
            --check-integrity \
            --optimize-storage \
            --update-thumbnails
      
      - name: Generate maintenance report
        run: |
          python bots/image-agents/maintenance_agent.py \
            --report logs/image-maintenance-report.md
      
      - name: Commit maintenance updates
        run: |
          git config user.name "Image Maintenance Agent"
          git config user.email "bot@github.com"
          git add logs/
          git diff --staged --quiet || git commit -m "🔧 Image maintenance completed"
          git push

  generate-summary:
    runs-on: ubuntu-latest
    needs: [image-indexing, image-analysis, image-verification, image-organization, image-maintenance]
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Generate Summary Report
        run: |
          echo "## Image Processing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image processing workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Jobs Status:" >> $GITHUB_STEP_SUMMARY
          echo "- Indexing: Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Analysis: Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Verification: Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Organization: Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Maintenance: Complete" >> $GITHUB_STEP_SUMMARY
