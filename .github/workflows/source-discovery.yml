name: Safe Source Discovery

on:
  # Run daily at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run on push to main (for testing)
  push:
    branches:
      - main
    paths:
      - 'scripts/safe-source-expander.py'

jobs:
  discover-sources:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests feedparser
      
      - name: Run source discovery
        run: |
          python scripts/safe-source-expander.py
      
      - name: Check for discoveries
        id: check_discoveries
        run: |
          if [ -d "data/discovered_sources" ] && [ "$(ls -A data/discovered_sources/*.json 2>/dev/null)" ]; then
            echo "discoveries=true" >> $GITHUB_OUTPUT
            DISCOVERY_COUNT=$(ls -1 data/discovered_sources/*.json 2>/dev/null | wc -l)
            echo "count=$DISCOVERY_COUNT" >> $GITHUB_OUTPUT
          else
            echo "discoveries=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi
      
      - name: Create issue for new discoveries
        if: steps.check_discoveries.outputs.discoveries == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read the latest discovery report
            const discoveryFiles = fs.readdirSync('data/discovered_sources')
              .filter(f => f.endsWith('.md'))
              .sort()
              .reverse();
            
            if (discoveryFiles.length > 0) {
              const reportPath = path.join('data/discovered_sources', discoveryFiles[0]);
              const reportContent = fs.readFileSync(reportPath, 'utf8');
              
              // Create GitHub issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `New Source Discoveries - ${new Date().toISOString().split('T')[0]}`,
                body: `${reportContent}\n\n---\n\n**Action Required:**\nReview the discovered items above. To approve an item for integration:\n1. Comment "approve: [item title or URL]"\n2. The bot will download and process it\n3. Search index will be updated automatically`,
                labels: ['source-discovery', 'needs-review']
              });
            }
      
      - name: Commit discovery files
        if: steps.check_discoveries.outputs.discoveries == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/discovered_sources/
          git commit -m "Source discovery run - $(date +'%Y-%m-%d'): ${{ steps.check_discoveries.outputs.count }} items found"
          git push
