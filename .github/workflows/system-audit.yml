name: System-Wide Audit and Inspection

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
    - cron: '0 6 * * 0'  # Weekly on Sunday (deep audit)
  workflow_dispatch:
    inputs:
      audit_type:
        description: 'Audit type'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - deep
          - security-only
      output_format:
        description: 'Report format'
        required: false
        default: 'all'
        type: choice
        options:
          - markdown
          - json
          - text
          - all

permissions:
  contents: write
  issues: write

jobs:
  system-audit:
    runs-on: ubuntu-latest
    name: Execute System-Wide Audit
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Create logs directory
        run: mkdir -p logs
      
      - name: Run System Audit
        id: audit
        run: |
          FORMAT="${{ github.event.inputs.output_format || 'all' }}"
          python scripts/system-audit.py --format "$FORMAT" --output-dir logs
          
          # Capture audit status
          AUDIT_STATUS=$?
          echo "audit_status=$AUDIT_STATUS" >> $GITHUB_OUTPUT
          
          # Get audit details
          if [ -f logs/system_audit_*.json ]; then
            LATEST_JSON=$(ls -t logs/system_audit_*.json | head -1)
            OVERALL_STATUS=$(python -c "import json; data=json.load(open('$LATEST_JSON')); print(data.get('overall_status', 'UNKNOWN'))")
            TOTAL_ISSUES=$(python -c "import json; data=json.load(open('$LATEST_JSON')); print(data.get('summary', {}).get('total_issues', 0))")
            echo "overall_status=$OVERALL_STATUS" >> $GITHUB_OUTPUT
            echo "total_issues=$TOTAL_ISSUES" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate Audit Summary
        id: summary
        run: |
          # Find latest markdown report
          LATEST_MD=$(ls -t logs/system_audit_*.md | head -1)
          
          if [ -f "$LATEST_MD" ]; then
            # Extract summary for GitHub
            echo "audit_summary<<EOF" >> $GITHUB_OUTPUT
            head -50 "$LATEST_MD" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload Audit Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports-${{ github.run_number }}
          path: |
            logs/system_audit_*.md
            logs/system_audit_*.json
            logs/system_audit_*.txt
          retention-days: 90
      
      - name: Commit Audit Reports
        run: |
          git config user.name "System Audit Bot"
          git config user.email "audit-bot@github.com"
          
          # Add audit reports
          git add logs/system_audit_*.{md,json,txt} 2>/dev/null || true
          
          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No new audit reports to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "📋 System audit completed: $TIMESTAMP

Status: ${{ steps.audit.outputs.overall_status || 'COMPLETED' }}
Issues: ${{ steps.audit.outputs.total_issues || '0' }}
Run: ${{ github.run_number }}"
            git push
          fi
      
      - name: Create Issue for Critical Status
        if: steps.audit.outputs.overall_status == 'CRITICAL'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Find latest markdown report
            const { execSync } = require('child_process');
            const latestMd = execSync('ls -t logs/system_audit_*.md | head -1').toString().trim();
            
            if (latestMd && fs.existsSync(latestMd)) {
              const report = fs.readFileSync(latestMd, 'utf8');
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 CRITICAL: System Audit Detected Critical Issues',
                body: `## Critical System Audit Alert

**Audit ID:** Run #${{ github.run_number }}
**Timestamp:** ${new Date().toISOString()}
**Status:** CRITICAL
**Total Issues:** ${{ steps.audit.outputs.total_issues }}

### Action Required
The system audit has detected critical issues that require immediate attention.

### Full Report
\`\`\`
${report.substring(0, 60000)}
\`\`\`

### Artifacts
Download full reports from [GitHub Actions artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

---
*This issue was created automatically by the System Audit Bot.*`,
                labels: ['critical', 'audit', 'automated-alert', 'priority-high']
              });
            }
      
      - name: Create Issue for Degraded Status
        if: steps.audit.outputs.overall_status == 'DEGRADED'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const latestMd = execSync('ls -t logs/system_audit_*.md | head -1').toString().trim();
            
            if (latestMd && fs.existsSync(latestMd)) {
              const report = fs.readFileSync(latestMd, 'utf8');
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ System Audit Detected Issues',
                body: `## System Audit Alert

**Audit ID:** Run #${{ github.run_number }}
**Timestamp:** ${new Date().toISOString()}
**Status:** DEGRADED
**Total Issues:** ${{ steps.audit.outputs.total_issues }}

### Action Recommended
The system audit has detected issues that should be addressed.

### Report Summary
\`\`\`
${report.substring(0, 30000)}
\`\`\`

### Full Reports
Download complete reports from [GitHub Actions artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

---
*This issue was created automatically by the System Audit Bot.*`,
                labels: ['audit', 'automated-alert', 'needs-review']
              });
            }
      
      - name: Post Summary Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            // This would be useful if triggered by PR
            const status = '${{ steps.audit.outputs.overall_status || 'COMPLETED' }}';
            const issues = '${{ steps.audit.outputs.total_issues || '0' }}';
            
            console.log(`Audit completed with status: ${status}, issues: ${issues}`);

  weekly-deep-audit:
    runs-on: ubuntu-latest
    name: Weekly Deep System Audit
    if: github.event.schedule == '0 6 * * 0' || github.event.inputs.audit_type == 'deep'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run Deep Audit
        run: |
          mkdir -p logs
          
          # Run standard audit
          python scripts/system-audit.py --format all --output-dir logs
          
          # Additional deep checks
          echo "Running deep system analysis..."
          
          # Check Git history
          git log --oneline --since="7 days ago" > logs/git_activity_weekly.txt
          
          # Repository statistics
          echo "=== Repository Statistics ===" > logs/repo_stats_weekly.txt
          echo "Total commits: $(git rev-list --count HEAD)" >> logs/repo_stats_weekly.txt
          echo "Total branches: $(git branch -a | wc -l)" >> logs/repo_stats_weekly.txt
          echo "Total files: $(git ls-files | wc -l)" >> logs/repo_stats_weekly.txt
          
          # Disk usage summary
          du -sh . > logs/disk_usage_weekly.txt
          du -sh data/ logs/ cache/ tmp/ 2>/dev/null >> logs/disk_usage_weekly.txt || true
      
      - name: Create Weekly Summary Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            // Get audit report
            const latestMd = execSync('ls -t logs/system_audit_*.md | head -1').toString().trim();
            let auditSummary = 'Report not found';
            
            if (latestMd && fs.existsSync(latestMd)) {
              const report = fs.readFileSync(latestMd, 'utf8');
              // Extract executive summary
              const summaryMatch = report.match(/## EXECUTIVE SUMMARY[\s\S]*?(?=##|$)/);
              auditSummary = summaryMatch ? summaryMatch[0] : report.substring(0, 5000);
            }
            
            // Get repo stats
            let repoStats = 'Stats not available';
            if (fs.existsSync('logs/repo_stats_weekly.txt')) {
              repoStats = fs.readFileSync('logs/repo_stats_weekly.txt', 'utf8');
            }
            
            // Get disk usage
            let diskUsage = 'Usage not available';
            if (fs.existsSync('logs/disk_usage_weekly.txt')) {
              diskUsage = fs.readFileSync('logs/disk_usage_weekly.txt', 'utf8');
            }
            
            const weekNumber = Math.ceil((new Date() - new Date(new Date().getFullYear(), 0, 1)) / 604800000);
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Weekly System Audit Summary - Week ${weekNumber}, ${new Date().getFullYear()}`,
              body: `## Weekly Deep System Audit Report

**Week:** ${weekNumber} of ${new Date().getFullYear()}
**Date:** ${new Date().toISOString().split('T')[0]}
**Audit Run:** #${{ github.run_number }}

---

### Audit Summary

${auditSummary}

---

### Repository Statistics

\`\`\`
${repoStats}
\`\`\`

---

### Disk Usage

\`\`\`
${diskUsage}
\`\`\`

---

### Actions

- [ ] Review audit findings
- [ ] Address any critical or degraded issues
- [ ] Update documentation if needed
- [ ] Plan capacity adjustments if required

### Full Reports

Download comprehensive reports from [GitHub Actions artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

---

*This weekly summary was generated automatically by the System Audit Bot.*`,
              labels: ['weekly-summary', 'audit', 'automated-report']
            });
      
      - name: Commit Weekly Reports
        run: |
          git config user.name "System Audit Bot"
          git config user.email "audit-bot@github.com"
          
          git add logs/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Weekly deep system audit - Week $(date +%V)"
            git push
          fi

  security-audit:
    runs-on: ubuntu-latest
    name: Security-Focused Audit
    if: github.event.inputs.audit_type == 'security-only'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run Security Audit
        run: |
          mkdir -p logs
          
          echo "=== Security Audit ===" > logs/security_audit.txt
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> logs/security_audit.txt
          echo "" >> logs/security_audit.txt
          
          # Check for .env file
          echo "Checking for .env file..." >> logs/security_audit.txt
          if [ -f .env ]; then
            echo "⚠️ WARNING: .env file found in repository!" >> logs/security_audit.txt
          else
            echo "✅ OK: No .env file in repository" >> logs/security_audit.txt
          fi
          echo "" >> logs/security_audit.txt
          
          # Check .gitignore
          echo "Checking .gitignore configuration..." >> logs/security_audit.txt
          if grep -q ".env" .gitignore; then
            echo "✅ OK: .env is in .gitignore" >> logs/security_audit.txt
          else
            echo "⚠️ WARNING: .env should be in .gitignore" >> logs/security_audit.txt
          fi
          echo "" >> logs/security_audit.txt
          
          # Check for sensitive files
          echo "Checking for sensitive files..." >> logs/security_audit.txt
          find . -type f \( -name "*.key" -o -name "*.pem" -o -name "*.p12" \) -not -path "./.git/*" > logs/sensitive_files.txt || true
          if [ -s logs/sensitive_files.txt ]; then
            echo "⚠️ WARNING: Potential sensitive files found:" >> logs/security_audit.txt
            cat logs/sensitive_files.txt >> logs/security_audit.txt
          else
            echo "✅ OK: No obvious sensitive files detected" >> logs/security_audit.txt
          fi
          
          cat logs/security_audit.txt
      
      - name: Upload Security Audit
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.run_number }}
          path: logs/security_audit.txt
          retention-days: 365
