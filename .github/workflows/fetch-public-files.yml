name: Fetch and Process Public Files

on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly on 1st at midnight
  workflow_dispatch:  # Allow manual trigger
    inputs:
      fetch_fbi:
        description: 'Fetch FBI Vault files'
        required: false
        type: boolean
        default: false
      fetch_doj:
        description: 'Fetch DOJ flight logs'
        required: false
        type: boolean
        default: false

jobs:
  fetch-and-process:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests PyPDF2 pytesseract pillow pdf2image
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils
      
      - name: Create data directories
        run: |
          mkdir -p data/public_files
          mkdir -p data/processed
      
      - name: Fetch public files
        if: github.event.inputs.fetch_fbi == 'true' || github.event.inputs.fetch_doj == 'true'
        run: |
          python scripts/fetch-public-files.py --non-interactive
        continue-on-error: true
      
      - name: Process PDFs
        run: |
          python scripts/process-pdfs.py
        continue-on-error: true
      
      - name: Update search index
        run: |
          python scripts/generate-search-index.py
      
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/processed/ web/js/search-index.js
          git commit -m "🔄 Update processed files and search index [automated]"
          git push
        continue-on-error: true
      
      - name: Summary
        run: |
          echo "### Public Files Processing Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Files fetched and processed" >> $GITHUB_STEP_SUMMARY
          echo "**Cost:** \$0 (Free tier)" >> $GITHUB_STEP_SUMMARY
          
          if [ -f data/processed/processing_summary.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Processing Summary:**" >> $GITHUB_STEP_SUMMARY
            cat data/processed/processing_summary.json >> $GITHUB_STEP_SUMMARY
          fi
